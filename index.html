<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Finanzas</title>
<style>
:root{
  --bg:#E9EDEA; --paper:#FFFFFF; --ink:#141C18; --muted:#5B6862; --line:#D2D8D4;
  --row:#E1E5E2; --row-alt:#D8DDD9;
  --inc:#1D7A4C; --exp:#B3261E; --neutral:#6E7A74; --focus:#1F5FD1;
  --r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td.num,.hero,.money{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra superior ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(233,237,234,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.month{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.month button{border:0;background:none;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted)}
.month button:active{background:var(--row)}
.month h1{margin:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600}
.sync svg{width:18px;height:18px}
.sync.busy svg{animation:spin 1s linear infinite}
.sync small{font-weight:400;color:var(--muted)}
.offline{font-size:12px;color:var(--exp);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sync.busy svg{animation:none}}

main{max-width:600px;margin:0 auto;padding:16px}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:17px;margin:0 0 10px;font-weight:650}
.block{margin-top:28px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{border:0;background:none;color:var(--focus);font-weight:600;padding:4px 0}
.muted{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin:28px 0 8px;text-align:center}

/* ---------- voucher del resumen ---------- */
.slip-wrap{filter:drop-shadow(0 1px 0 rgba(20,28,24,.10)) drop-shadow(0 6px 14px rgba(20,28,24,.06))}
.slip{background:var(--paper);padding:20px 20px 34px;border-radius:var(--r) var(--r) 0 0;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%}
.slip-k{margin:0;color:var(--muted);font-size:15px}
.hero{margin:6px 0 14px;font-family:var(--round);font-weight:750;font-size:clamp(42px,13vw,66px);line-height:1;letter-spacing:-.02em}
.pos{color:var(--inc)} .neg{color:var(--exp)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split span{display:block;color:var(--muted);font-size:14px}
.split b{font-family:var(--round);font-size:21px;font-weight:700}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.meter{height:8px;border-radius:99px;background:#CFE6D9;margin:16px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--exp);border-radius:99px}
.slip-note{margin:0;font-size:14px;color:var(--muted)}
.slip-sav{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 0;padding-top:14px;border-top:2px dashed var(--line)}
.slip-sav span{color:var(--muted);font-size:15px}
.slip-sav b{font-family:var(--round);font-size:20px}
.review{display:flex;width:100%;justify-content:space-between;align-items:center;margin-top:16px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-weight:600;text-align:left}
.review::after{content:"Revisar";color:var(--focus);font-weight:600}

/* gráfico y barras */
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cats{list-style:none;margin:0;padding:0}
.cats li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.cats li:last-child{border-bottom:0}
.cats .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--row)}
.cats .bar i{display:block;height:100%;border-radius:99px;background:var(--exp);opacity:.8}
.cats small{color:var(--muted);font-weight:400;margin-left:6px}

/* ahorros */
.savings{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:12px;overflow:hidden}
.savings li{padding:12px 14px;border-bottom:1px solid var(--line)}
.savings li:last-child{border-bottom:0}
.savings button{all:unset;display:grid;grid-template-columns:1fr auto;width:100%;gap:4px 12px;cursor:pointer}
.savings .goal{grid-column:1/-1;display:block;font-size:13px;color:var(--muted)}
.savings .goal .bar{display:block;height:5px;background:var(--row);border-radius:99px;margin-top:5px}
.savings .goal .bar i{display:block;height:100%;background:var(--inc);border-radius:99px}
.empty{background:var(--paper);border-radius:12px;padding:16px;color:var(--muted);font-size:15px;margin:0}

/* ---------- tablas tipo libro ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--row);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select.small{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:14px}
table.ledger{width:100%;border-collapse:separate;border-spacing:0 2px;margin-bottom:26px}
.ledger thead th{padding:14px 12px;text-align:left;font-size:16px;font-weight:650;color:#fff}
.ledger thead th.num{text-align:right;font-family:var(--round);font-size:20px;font-weight:750}
.ledger thead th:first-child{border-radius:12px 0 0 12px}
.ledger thead th:last-child{border-radius:0 12px 12px 0}
.ledger.inc thead th{background:var(--inc)}
.ledger.exp thead th{background:var(--exp)}
.ledger.other thead th{background:var(--neutral)}
.ledger tbody tr{cursor:pointer}
.ledger tbody td{background:var(--row);color:#000;padding:10px 12px;vertical-align:top;font-size:15px}
.ledger tbody tr:nth-child(even) td{background:var(--row-alt)}
.ledger tbody tr:active td{background:#CBD2CD}
.ledger td.d{width:54px;white-space:nowrap;color:#000}
.ledger td.n span{display:block;overflow-wrap:anywhere}
.ledger td.n small{display:block;color:#3F4944;font-size:12.5px;margin-top:2px}
.ledger td.num{text-align:right;white-space:nowrap}
.ledger td.num small{display:block;color:#3F4944;font-size:12.5px}
.ledger tr.unrev td.n span{font-weight:700}
.ledger tr.unrev td.d::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--focus);margin-right:5px;vertical-align:1px}
.ledger .nothing td{cursor:default;color:#3F4944;font-style:italic}
.ledger tbody tr.static{cursor:default}
.note-small{font-size:13px;color:var(--muted);margin:-18px 0 26px}

/* suscripciones */
table.subs{width:100%;border-collapse:separate;border-spacing:0 2px}
.subs thead th{background:var(--paper);padding:14px 12px;vertical-align:bottom;text-align:left}
.subs thead th:first-child{border-radius:12px 0 0 12px}
.subs thead th:last-child{border-radius:0 12px 12px 0;text-align:right}
.subs .total{font-family:var(--round);font-size:32px;font-weight:750;color:var(--exp);line-height:1.05;display:block}
.subs .total-l{font-size:13px;font-weight:500;color:var(--exp)}
.subs .fx{font-family:var(--round);font-size:17px;font-weight:700;color:var(--ink);display:block}
.subs .fx-l{display:block;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.subs tbody td{background:var(--row);color:#000;padding:10px 12px;font-size:15px;vertical-align:top}
.subs tbody tr:nth-child(even) td{background:var(--row-alt)}
.subs td.v{text-align:center;white-space:nowrap}
.subs td.v small,.subs td.f small{display:block;color:#3F4944;font-size:12.5px}
.subs td.f{text-align:right;white-space:nowrap}
.subs button.nm{all:unset;cursor:pointer;display:block;font-weight:600;overflow-wrap:anywhere}
.subs button.nm:focus-visible{outline:2px solid var(--focus)}
.subs td small.cad{display:block;color:#3F4944;font-size:12.5px;font-weight:400}
.subs-foot{display:flex;justify-content:space-between;padding:12px 4px;font-size:15px}
details.inactive{margin-top:16px;font-size:14px;color:var(--muted)}
details.inactive summary{cursor:pointer;padding:6px 0}

/* análisis */
.panel{background:var(--paper);border-radius:12px;padding:16px;margin-bottom:16px}
.panel p{margin:0 0 12px}
textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.45;background:#FBFCFB;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:650;background:var(--ink);color:#fff}
.btn.ghost{background:var(--row);color:var(--ink)}
.btn.danger{background:none;color:var(--exp);padding-left:0}
.btn:disabled{opacity:.5}
.answers{list-style:none;padding:0;margin:0}
.answers li{border-top:1px solid var(--line);padding:10px 0}
.answers details summary{cursor:pointer;font-weight:600}
.answers pre{white-space:pre-wrap;font-family:var(--sans);font-size:14px;margin:8px 0 0}

/* ajustes */
.form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=password],select.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFCFB;font-size:16px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:#FBFCFB;font-size:14px;font-weight:500}
.chk input{margin:0;accent-color:var(--inc)}
.rules{list-style:none;padding:0;margin:0}
.rules li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.rules li:first-child{border-top:0}
.rules code{font-family:var(--sans);background:var(--row);padding:1px 6px;border-radius:6px}
.rules button{border:0;background:none;color:var(--exp);font-weight:600}
.status{font-size:14px;margin-top:8px}

/* ---------- navegación inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs .in>button.desk-only{display:none}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(20,28,24,.25)}

/* ---------- hoja modal ---------- */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,28,24,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{position:sticky;top:-8px;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 -18px 12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet h3{margin:0;font-size:19px}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--row);color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center}
.act-r{display:inline-flex;gap:8px;margin-left:auto}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:70;border:0;border-radius:12px;background:var(--focus);color:#fff;padding:10px 16px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sheet .row2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.row2>*,label.f{min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.sheet .types{display:flex;flex-wrap:wrap;gap:6px}
.sheet .types label{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.sheet .types input{position:absolute;opacity:0;pointer-events:none}
.sheet .types label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .types label:has(input:focus-visible){outline:2px solid var(--focus)}
.notice{background:#FFF4E5;border-radius:10px;padding:10px 12px;font-size:14px}
.calc{font-size:14px;color:var(--muted)}
.sheet .actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px;flex-wrap:wrap}
.map-table{font-size:13px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:160px}
.map-table table{border-collapse:collapse}
.map-table td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 16px rgba(0,0,0,.2)}

/* resumen en grilla */
.res{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"slip" "rev" "tc" "chart" "cats" "sav";align-items:start}
.res>.a-slip{grid-area:slip}.res>.a-rev{grid-area:rev}.res>.a-tc{grid-area:tc}.res>.a-chart{grid-area:chart}.res>.a-cats{grid-area:cats}.res>.a-sav{grid-area:sav}
.tcbox{margin-top:16px;background:var(--paper);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;border:0;width:100%;text-align:left}
.tcbox span{color:var(--muted);font-size:14px}
.tcbox b{font-family:var(--round);font-size:18px}
.gear{border:0;background:none;width:38px;height:38px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
@media (max-width:430px){.sync span{display:none}.sync{padding:8px}.month button{width:30px}}

.sub-split{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.35}
.res2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
.res2 .r-chart>.block:first-child{margin-top:0}
.proj-box{margin-top:16px}
.proj-box h2{margin:0}
.cats .bar i.ok{background:var(--inc);opacity:.85}
.cats .bar i.warn{background:#C98A10}
.cats .bar i.over{background:var(--exp)}
.cats b small{font-weight:400;color:var(--muted);font-size:12.5px}
.fx-list{list-style:none;margin:0;padding:0}
.fx-list li{border-top:1px solid var(--line);padding:10px 0;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.fx-list li:first-child{border-top:0}
.fx-list small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.cost-list{list-style:none;padding:0;margin:0}
.cost-list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.cost-list li:first-child{border-top:0}
.cost-list small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
table.hon{width:100%;border-collapse:collapse;font-size:14px}
.hon th,.hon td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.hon td.num,.hon th.num{text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
/* deudas */
.debts{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.debts li{background:var(--row);color:#000;padding:12px 14px}
.debts li:nth-child(even){background:var(--row-alt)}
.debts li:first-child{border-radius:12px 12px 0 0}
.debts li:last-child{border-radius:0 0 12px 12px}
.debts li:only-child{border-radius:12px}
.debts li.click{cursor:pointer}
.dl-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.dl-name{font-weight:600;overflow-wrap:anywhere}
.dl-bar{height:7px;border-radius:99px;background:#fff;margin:8px 0 6px;overflow:hidden}
.dl-bar i{display:block;height:100%;background:var(--inc);border-radius:99px}
.dl-meta{display:flex;justify-content:space-between;gap:2px 12px;flex-wrap:wrap;font-size:12.5px;color:#3F4944}
details.more summary{cursor:pointer;color:var(--focus);font-weight:600;padding:10px 2px;font-size:15px}
/* tarjetas */
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin:28px 0 8px}
.card-h h2{margin:0}
.card-h small{color:var(--muted);font-size:13px}
.proj{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:120px;margin:10px 0 4px}
.proj div{display:grid;grid-template-rows:1fr auto auto;height:100%;text-align:center;font-size:11px;color:var(--muted)}
.proj i{align-self:end;display:block;background:var(--exp);border-radius:4px 4px 0 0;opacity:.85}
.proj b{font-size:11px;color:var(--ink);font-weight:600}
.items{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.items label{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.items label:last-child{border-bottom:0}
.items small{display:block;color:var(--muted);font-size:12px}
.items .subtag{color:var(--exp);font-weight:600}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:8px 2px}
.sumline b{white-space:nowrap}
.desk-only{display:none!important}

/* ---------- Mac y pantallas grandes ---------- */
@media (min-width:900px){
  body{padding-bottom:0}
  .desk-only{display:grid!important}
  .gear{display:none}
  nav.tabs{top:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px;background:rgba(255,255,255,.7)}
  nav.tabs .in{display:flex;flex-direction:column;gap:2px}
  nav.tabs .in::before{content:"Finanzas";font-family:var(--round);font-weight:750;font-size:22px;padding:0 12px 18px}
  nav.tabs button{grid-template-columns:22px 1fr;justify-items:start;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14.5px}
  nav.tabs button svg{width:20px;height:20px}

// Reglas incluidas: patrón (sobre el texto del banco normalizado) → nombre, categoría, suscripción.

].map(r => ({match:r[0], name:r[1], category:r[2], sub:r[3], ambiguous:!!r[4], builtin:true}));

const SERVICE_KEYS = {microsoft:['MICROSOFT','MSFT','XBOX'], apple:['APPLE','ICLOUD'], google:['GOOGLE','YOUTUBE'],
  openai:['OPENAI','CHATGPT'], anthropic:['ANTHROPIC','CLAUDE'], spotify:['SPOTIFY'], flexibits:['FLEXIBITS'], netflix:['NETFLIX']};

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const ymNow = () => today().slice(0, 7);
const addMonths = (ym, k) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dateOfYm = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1);
const monthLong = ym => dateOfYm(ym).toLocaleDateString('es-CL', {month:'long', year:'numeric'});
const monthOnly = ym => dateOfYm(ym).toLocaleDateString('es-CL', {month:'long'});
const monthShort = ym => dateOfYm(ym).toLocaleDateString('es-CL', {month:'short'}).replace('.', '');
const dm = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '';
const dmy = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(2, 4)}` : '';
const daysBetween = (a, b) => Math.round((new Date(a + 'T12:00') - new Date(b + 'T12:00')) / 86400000);
const addToDate = (s, months) => { const d = new Date(s + 'T12:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + months); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoOf(d); };
const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const matchKey = s => norm(s).replace(/[*#_.\/\\-]/g, ' ').replace(/\b\d{5,}\b/g, ' ').replace(/\s+/g, ' ').trim();
const fmtCLP = n => (n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n || 0)).toLocaleString('es-CL');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
const fmtUSD = n => 'US$' + Number(n || 0).toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
const short = n => { const a = Math.abs(n); if (a >= 1e6) return '$' + (n / 1e6).toLocaleString('es-CL', {maximumFractionDigits:1}) + ' M'; if (a >= 1e3) return '$' + Math.round(n / 1e3).toLocaleString('es-CL') + ' mil'; return '$' + Math.round(n); };
const titleCase = s => String(s || '').toLowerCase().replace(/(^|[\s(\/-])([a-zñáéíóú])/g, (m, a, b) => a + b.toUpperCase());

/* =====================================================================
   Almacenamiento local (IndexedDB con respaldo en localStorage)
   ===================================================================== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('sin IndexedDB'));
      const r = indexedDB.open('finanzas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction('kv').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
    });
  },
  set(k, v) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
};

const DEFAULT_SETTINGS = {
  url:'', token:'', banks:['bchile','santander','bestado'], customDomains:'', ownNames:'',
  firstDays:90, lastSync:0, lastSyncAt:0, rates:null, dolarManual:'', context:'', unparsed:[], cartolaMaps:{}, cardMaps:{}, cards:{}
};
let S = { settings: {...DEFAULT_SETTINGS}, recs: {}, ui: { tab:'resumen', month: ymNow(), movFilter:'all', bankFilter:'' } };

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const data = { settings: S.settings, recs: S.recs };
    try { if (DB.db) await DB.set('state', data); else localStorage.setItem('finanzas', JSON.stringify(data)); }
    catch (e) { toast('No se pudo guardar en este dispositivo: ' + e.message); }
  }, 200);
  schedulePush();
}

/* Sube los cambios solos unos segundos después de editar, para que el Mac y el iPhone queden iguales. */
let pushTimer = null;
function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { if (Object.values(S.recs).some(r => r.dirty)) autoSync(true); }, 15000);
}
function autoSync(force) {
  if (!S.settings.url || !S.settings.token || !navigator.onLine || syncing) return;
  const stale = Date.now() - (S.settings.lastSyncAt || 0) > 10 * 60000;
  if (force || stale || Object.values(S.recs).some(r => r.dirty)) sync({ quiet: true });
}

/* Ajustes compartidos entre dispositivos (sin la dirección ni el token) */
function shareSettings() {
  const data = {};
  SHARED_KEYS.forEach(k => data[k] = S.settings[k]);
  put({ id:'settings_shared', kind:'settings', data });
}
function applySharedSettings(rec) {
  if (rec && rec.data) SHARED_KEYS.forEach(k => { if (rec.data[k] !== undefined) S.settings[k] = rec.data[k]; });
}

/* Nunca se guardan números de tarjeta: solo un alias como "Tarjeta 1 Banco de Chile". */
function scrubCard(v) {
  return String(v || '')
    .replace(/(?:[*x•#]{2,}[ -]?)+\d{2,4}/gi, '')
    .replace(/\b(?:\d[ -]?){12,19}\b/g, '')
    .replace(/(termina(?:da|do)?|finalizada|n[°º]|n[uú]mero|nro\.?)\s*(?:en\s*)?\**\d{4}\b/gi, '')
    .replace(/\s{2,}/g, ' ').trim();
}
function cardLabel(id) {
  if (!id) return '';
  const cards = S.settings.cards || (S.settings.cards = {});
  if (!cards[id]) {
    const bank = id.split('-')[0];
    const n = Object.keys(cards).filter(k => k.split('-')[0] === bank).length + 1;
    cards[id] = `Tarjeta ${n} ${BANKS[bank] || 'otro banco'}`;
    setTimeout(shareSettings, 0);
  }
  return cards[id];
}

function put(rec) {
  rec.updatedAt = Date.now();
  rec.dirty = true;
  S.recs[rec.id] = rec;
  save();
  return rec;
}
function removeRec(id) {
  const r = S.recs[id];
  if (!r) return;
  r.deleted = true;
  put(r);
  Object.values(S.recs).forEach(c => { if (c.parent === id && !c.deleted) { c.deleted = true; put(c); } });
}

/* =====================================================================
   Lógica de movimientos
   ===================================================================== */
const alive = r => r && !r.deleted;
const allTx = () => Object.values(S.recs).filter(r => r.kind === 'tx' && alive(r));
const receipts = () => Object.values(S.recs).filter(r => r.kind === 'receipt' && alive(r));
const userRules = () => Object.values(S.recs).filter(r => r.kind === 'rule' && alive(r)).sort((a, b) => b.match.length - a.match.length);
const savingsRecs = () => Object.values(S.recs).filter(r => r.kind === 'saving' && alive(r)).sort((a, b) => a.name.localeCompare(b.name));

const rate = () => Number(S.settings.dolarManual) || (S.settings.rates && S.settings.rates.dolar) || 0;

function ownList() {
  return String(S.settings.ownNames || '').split(/[,;\n]/).map(s => norm(s).replace(/[.\s-]/g, ' ').replace(/\s+/g, ' ').trim()).filter(s => s.length >= 4);
}
function isOwn(name) {
  if (!name) return false;
  const n = norm(name).replace(/[.\s-]/g, ' ').replace(/\s+/g, ' ');
  return ownList().some(o => n.includes(o));
}
function effTipo(t) {
  if (t.tipoLocked) return t.tipo;
  if ((t.tipo === 'transfer_in' || t.tipo === 'transfer_out') && isOwn(t.counterparty)) return 'interna';
  return t.tipo;
}
const dir = t => (TIPOS[effTipo(t)] || {dir:0}).dir;
const clp = t => t.currency === 'USD' ? Math.round((t.amount || 0) * (t.fx || rate())) : (t.amount || 0);
const clpNow = t => t.currency === 'USD' ? Math.round((t.amount || 0) * (rate() || t.fx || 0)) : (t.amount || 0);
const bankOn = t => !t.bank || t.bank === 'otro' || t.source === 'manual' || S.settings.banks.includes(t.bank);
const counted = t => !t.dupOf && dir(t) !== 0 && bankOn(t);
const pendingList = () => allTx().filter(t => !['manual', 'auto', 'fijo'].includes(t.source) && !t.reviewed && !t.dupOf && bankOn(t));
const isIntl = t => !!t.intl || t.currency === 'USD';

function ruleFor(t) {
  const key = matchKey(t.rawName || t.counterparty || '');
  if (!key) return null;
  for (const r of userRules()) {
    if (key.includes(r.match) && (r.amount == null || (r.currency === t.currency && Math.abs(r.amount - t.amount) <= Math.max(1, r.amount * 0.02)))) return r;
  }
  for (const r of BUILTIN_RULES) if (key.includes(r.match)) return r;
  return null;
}

function receiptName(t) {
  const key = matchKey(t.rawName);
  const cands = receipts().filter(r => (SERVICE_KEYS[r.service] || []).some(k => key.includes(k)) && Math.abs(daysBetween(r.date, t.date)) <= 4);
  if (!cands.length) return '';
  const same = cands.find(r => r.currency === t.currency && Math.abs(r.amount - t.amount) <= Math.max(1, t.amount * 0.03));
  const pick = same || (cands.length === 1 ? cands[0] : null);
  return pick ? pick.product : '';
}

function cleanName(raw) {
  let s = norm(raw).replace(/^(PAYPAL|DLO|DL|MP|MERPAGO|SUMUP|PAYU|FLOW|WEBPAY)\s*\*\s*/, '').replace(/[*#]/g, ' ')
    .replace(/\b(LTDA?|LIMITED|INC|LLC|S ?A|SPA|CO|CORP|BV|GMBH|AB)\b\.?/g, ' ').replace(/\b\d{3,}\b/g, ' ')
    .replace(/\b(CL|CHL|SANTIAGO|STGO|CHILE)\b/g, ' ').replace(/\s+/g, ' ').trim();
  return titleCase(s);
}

function displayName(t) {
  if (t.name) return t.name;
  const r = ruleFor(t);
  if (r && !r.builtin) return r.name;
  if (t.rawName && (!r || r.ambiguous)) { const rc = receiptName(t); if (rc) return rc; }
  if (r) return r.name;
  if (t.rawName) return cleanName(t.rawName) || t.rawName;
  if (t.counterparty) return (t.tipo === 'transfer_in' ? 'De ' : 'A ') + titleCase(t.counterparty);
  return (TIPOS[effTipo(t)] || {}).label || 'Movimiento';
}

function categoryOf(t) {
  if (t.category) return t.category;
  const r = ruleFor(t);
  const d = dir(t);
  if (r && r.category && d < 0) return r.category;
  const tp = effTipo(t);
  if (tp === 'transfer_in' || tp === 'transfer_out') return 'Transferencias';
  if (tp === 'descuento') return 'Descuentos y retenciones';
  if (tp === 'interna') return 'Entre mis cuentas';
  if (tp === 'pago_tarjeta') return 'Pago de tarjeta';
  return d > 0 ? 'Otros ingresos' : 'Otros';
}

let recurringCache = null;
function recurringKeys() {
  if (recurringCache) return recurringCache;
  const groups = {};
  allTx().filter(t => t.tipo === 'gasto' && t.rawName && !t.dupOf).forEach(t => { const k = matchKey(t.rawName); (groups[k] = groups[k] || []).push(t); });
  const set = new Set();
  Object.entries(groups).forEach(([k, g]) => {
    if (g.length < 2) return;
    g.sort((a, b) => a.date.localeCompare(b.date));
    let hits = 0;
    for (let i = 1; i < g.length; i++) {
      const gap = daysBetween(g[i].date, g[i - 1].date);
      const similar = g[i].currency === g[i - 1].currency && Math.abs(g[i].amount - g[i - 1].amount) <= g[i - 1].amount * 0.15;
      if (similar && ((gap >= 25 && gap <= 35) || (gap >= 350 && gap <= 380))) hits++;
    }
    if (hits >= 1) set.add(k);
  });
  return (recurringCache = set);
}
function isSub(t) {
  if (t.sub === true || t.sub === false) return t.sub;
  if (dir(t) >= 0) return false;
  const r = ruleFor(t);
  if (r && (r.sub === true || r.sub === false)) return r.sub;
  return t.rawName ? recurringKeys().has(matchKey(t.rawName)) : false;
}

function monthTx(ym) { return allTx().filter(t => t.date && t.date.startsWith(ym) && bankOn(t)); }
function totals(ym) {
  let inc = 0, exp = 0;
  monthTx(ym).forEach(t => { if (!counted(t)) return; const v = clp(t); if (dir(t) > 0) inc += v; else exp += v; });
  return { inc, exp, net: inc - exp };
}

/* =====================================================================
   Movimientos fijos mensuales (ej. transferencia a la familia, cuota de un crédito)
   ===================================================================== */
const fixedRecs = () => Object.values(S.recs).filter(r => r.kind === 'fixed' && alive(r)).sort((a, b) => a.name.localeCompare(b.name));
const ufNow = () => (S.settings.rates && S.settings.rates.uf) || 0;
const fixedCLP = f => f.currency === 'UF' ? Math.round(f.amount * ufNow()) : f.amount;
/* Fechas de pago: el día del primer pago, cada mes, desde el inicio hasta el término (o sin término) */
function fixedDates(f, until) {
  const out = [], d = +f.start.slice(8, 10);
  let y = +f.start.slice(0, 4), m = +f.start.slice(5, 7);
  for (let i = 0; i < 600; i++) {
    const date = dueOn(y, m + i, d);
    if (date > until || (f.end && date > f.end)) break;
    out.push(date);
  }
  return out;
}
/* Crea el registro de cada mes cuando llega su fecha. Si después llega el correo o la cartola del mismo pago, este se oculta como duplicado. */
function materializeFixed() {
  const t = today();
  let n = 0;
  fixedRecs().forEach(f => {
    fixedDates(f, t).forEach(date => {
      const id = `fx_${f.id}_${date.slice(0, 7)}`;
      if (S.recs[id]) return;
      put({ id, kind:'tx', source:'fijo', fixed: f.id, tipo: f.tipo, tipoLocked: true, category: f.category, name: f.name,
            amount: fixedCLP(f), currency:'CLP', date, bank: f.bank || '', reviewed: true });
      n++;
    });
    if (f.end) allTx().filter(x => x.fixed === f.id && x.date > f.end && !x.edited).forEach(x => removeRec(x.id));
  });
  return n;
}

/* Vencimientos de los próximos 60 días para Google Calendar */
function calendarEvents() {
  const t = today(), lim = addToDate(t, 2), ev = {};
  const add = (id, title, date, amount) => {
    if (date < t || date > lim) return;
    ev[id] = ev[id] ? { ...ev[id], amount: ev[id].amount + amount } : { id, title, date, amount: Math.round(amount) };
  };
  debtItems().forEach(d => d.entries.forEach(e => {
    if (d.type === 'cuota') add(`card|${d.card}|${e.date}`, `Pago ${cardLabel(d.card)}`, e.date, e.amt);
    else if (d.type === 'loan') add(`loan|${d.id}|${e.date}`, `Cuota ${d.name}`, e.date, e.amt);
  }));
  subsData().filter(sd => sd.active).forEach(sd => add(`sub|${sd.name}|${sd.next}`, `Renovación ${sd.name}`, sd.next, clpNow(sd.last)));
  fixedRecs().filter(f => TIPOS[f.tipo].dir < 0).forEach(f => fixedDates(f, lim).forEach(date => add(`fix|${f.id}|${date}`, f.name, date, fixedCLP(f))));
  return Object.values(ev).sort((a, b) => a.date.localeCompare(b.date));
}

/* Presupuesto mensual por categoría */
const budgets = () => ((S.recs.budgets && !S.recs.budgets.deleted && S.recs.budgets.data) || {});
function budgetStatus(ym) {
  const b = budgets(), spent = {};
  monthTx(ym).filter(t => counted(t) && dir(t) < 0).forEach(t => { const c = categoryOf(t); spent[c] = (spent[c] || 0) + clp(t); });
  return Object.entries(b).filter(([, v]) => v > 0).map(([cat, limit]) => ({ cat, limit, spent: spent[cat] || 0, pct: Math.round((spent[cat] || 0) / limit * 100) }))
    .sort((a, b) => b.pct - a.pct);
}
/* Aviso una sola vez por mes y categoría al llegar al 80% y al 100% */
function checkBudgetAlerts() {
  const ym = ymNow(), seen = S.settings.budgetAlerts || (S.settings.budgetAlerts = {});
  const msgs = [];
  budgetStatus(ym).forEach(b => {
    [100, 80].some(th => {
      if (b.pct < th) return false;
      const k = `${ym}|${b.cat}|${th}`;
      if (!seen[k]) { seen[k] = 1; msgs.push(th === 100 ? `${b.cat}: superaste el presupuesto (${b.pct}%).` : `${b.cat}: llevas el ${b.pct}% del presupuesto.`); }
      return true;
    });
  });
  if (msgs.length) { save(); setTimeout(() => toast(msgs.join(' ')), 600); }
}

/* Duplicados entre fuentes: manual > correo > movimientos de tarjeta > cartola > fijo mensual */
const PRI = { manual:3, email:2, tarjeta:1.5, cartola:1, fijo:0.5 };
function flowSide(t) {
  if (['ingreso','transfer_in'].includes(t.tipo)) return '+';
  if (['gasto','transfer_out','pago_tarjeta'].includes(t.tipo)) return '-';
  return '';
}
function dedupPass() {
  const list = allTx().filter(t => PRI[t.source] && !t.notDup && flowSide(t));
  const groups = {};
  list.forEach(t => {
    const amt = t.net != null ? t.net : t.amount;
    const k = flowSide(t) + '|' + t.currency + '|' + (t.currency === 'USD' ? Math.round(amt * 100) : Math.round(amt));
    (groups[k] = groups[k] || []).push(t);
  });
  let changed = 0;
  Object.values(groups).forEach(g => {
    if (g.length < 2) return;
    g.sort((a, b) => PRI[b.source] - PRI[a.source]);
    const used = new Set(g.filter(t => t.dupOf).map(t => t.dupOf));
    for (const low of g) {
      if (low.dupOf) continue;
      const win = flowSide(low) === '+' ? 6 : 3;
      const high = g.find(h => h !== low && PRI[h.source] > PRI[low.source] && !h.dupOf && !used.has(h.id) && Math.abs(daysBetween(h.date, low.date)) <= win);
      if (high) { low.dupOf = high.id; used.add(high.id); put(low); changed++; }
    }
  });
  return changed;
}

/* =====================================================================
   Sincronización con Apps Script
   ===================================================================== */
async function api(body) {
  const res = await fetch(S.settings.url.trim(), { method:'POST', body: JSON.stringify({ ...body, token: S.settings.token.trim() }) });
  if (!res.ok) throw new Error('El servidor respondió ' + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Error desconocido');
  return j;
}

let syncing = false;
async function sync(opts) {
  const quiet = !!(opts && opts.quiet === true);
  if (syncing) return;
  if (!S.settings.url || !S.settings.token) { if (!quiet) { toast('Configura la conexión en Ajustes para sincronizar.'); go('ajustes'); } return; }
  if (!navigator.onLine) { if (!quiet) toast('Sin conexión. Tus datos siguen aquí; sincroniza cuando tengas internet.'); return; }
  syncing = true; $('#syncBtn').classList.add('busy');
  try {
    const sent = Object.values(S.recs).filter(r => r.dirty).map(r => { const c = {...r}; delete c.dirty; return c; });
    const j = await api({
      action:'sync', since: S.settings.lastSync || 0, changes: sent, banks: S.settings.banks,
      customDomains: String(S.settings.customDomains || '').split(/[,\s]+/).filter(Boolean), firstDays: Number(S.settings.firstDays) || 90,
      calendar: S.settings.calendarOn ? { on: true, amounts: !!S.settings.calendarAmounts, events: calendarEvents() } : (S.settings.calendarWasOn ? { on: false } : undefined)
    });
    S.settings.calendarWasOn = !!S.settings.calendarOn;
    if (j.calendar && j.calendar.error) toast('Calendario: ' + j.calendar.error);
    const sentAt = {}; sent.forEach(r => sentAt[r.id] = r.updatedAt);
    Object.values(S.recs).forEach(r => { if (r.dirty && sentAt[r.id] === r.updatedAt) r.dirty = false; });
    let fresh = 0;
    (j.records || []).forEach(r => {
      const local = S.recs[r.id];
      if (!local) { if (r.kind === 'tx' && !r.deleted) fresh++; S.recs[r.id] = {...r, dirty:false}; }
      else if (!local.dirty || (r.updatedAt || 0) > (local.updatedAt || 0)) S.recs[r.id] = {...r, dirty:false};
    });
    const shared = S.recs.settings_shared;
    if (shared && !shared.dirty) applySharedSettings(shared);
    materializeFixed();
    S.settings.lastSync = j.serverTime;
    S.settings.lastSyncAt = Date.now();
    if (j.rates) S.settings.rates = j.rates;
    S.settings.unparsed = j.unparsed || [];
    recurringCache = null;
    const dups = dedupPass();
    save(); render(); checkBudgetAlerts();
    let msg = fresh ? `${fresh} movimiento${fresh > 1 ? 's' : ''} nuevo${fresh > 1 ? 's' : ''}` : 'Todo al día';
    if (dups) msg += `, ${dups} duplicado${dups > 1 ? 's' : ''} ocultado${dups > 1 ? 's' : ''}`;
    if (j.partial) msg += '. Quedan correos por revisar: vuelve a sincronizar.';
    if (!quiet || fresh || dups) toast(msg + '.');
    if (Object.values(S.recs).some(r => r.dirty)) setTimeout(sync, 300); // cambios de deduplicación
  } catch (e) {
    if (!quiet) toast('No se pudo sincronizar: ' + e.message);
  } finally {
    syncing = false; $('#syncBtn').classList.remove('busy'); renderHeader();
  }
}

/* =====================================================================

function go(tab) {
  S.ui.tab = tab;
  $$('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + tab));
  $$('nav.tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  render();
  window.scrollTo(0, 0);
}

function render() {
  recurringCache = null;

}

function ago(ts) {
  if (!ts) return 'nunca';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'recién';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  return new Date(ts).toLocaleDateString('es-CL');
}

function renderHeader() {
  const ml = monthOnly(S.ui.month) + ' ' + S.ui.month.slice(0, 4);
  $('#monthLabel').textContent = ml.charAt(0).toUpperCase() + ml.slice(1);

  $('#offline').classList.toggle('hide', navigator.onLine);
  $('#fab').classList.toggle('hide', !['resumen', 'movs'].includes(S.ui.tab));
  $('#gearBtn').setAttribute('aria-pressed', S.ui.tab === 'ajustes');
}

/* ---------- Resumen ---------- */
/* Proyección al cierre del mes actual */
function monthProjection() {
  const ym = ymNow(), t = today();
  const lastDay = dueOn(+ym.slice(0, 4), +ym.slice(5, 7), 31);
  const T = totals(ym);
  let pendInc = 0, pendExp = 0;
  const lines = [];
  // Movimientos fijos que aún no llegan este mes
  fixedRecs().forEach(f => fixedDates(f, lastDay).filter(d => d > t && d.startsWith(ym)).forEach(() => {
    const v = fixedCLP(f);
    if (TIPOS[f.tipo].dir > 0) pendInc += v; else pendExp += v;
  }));
  // Suscripciones que se renuevan antes de fin de mes y aún no se cobran este mes
  let subsPend = 0;
  subsData().filter(sd => sd.active && !sd.last.date.startsWith(ym) && sd.next > t && sd.next <= lastDay).forEach(sd => subsPend += clpNow(sd.last));
  // Cuotas de créditos ingresados a mano (se pagan por transferencia)
  let loanPend = 0;
  loans().forEach(l => loanEntries(l).filter(e => e.date > t && e.date.startsWith(ym)).forEach(e => loanPend += e.amt));
  // Gasto variable: promedio diario de los 3 meses anteriores (sin fijos ni suscripciones)
  const variable = m => monthTx(m).filter(x => counted(x) && dir(x) < 0 && x.source !== 'fijo' && !isSub(x) && effTipo(x) !== 'descuento').reduce((a, x) => a + clp(x), 0);
  // Solo cuenta los días en que la app ya tenía datos, para no subestimar al comenzar a usarla.
  const prev = [1, 2, 3].map(k => addMonths(ym, -k));
  const prevEnd = dueOn(+prev[0].slice(0, 4), +prev[0].slice(5, 7), 31);
  const first = allTx().filter(x => counted(x) && x.source !== 'fijo').map(x => x.date).sort()[0] || t;
  const winStart = first > prev[2] + '-01' ? first : prev[2] + '-01';
  const covered = winStart <= prevEnd ? daysBetween(prevEnd, winStart) + 1 : 0;
  const prevTotal = prev.reduce((a, m) => a + variable(m), 0);
  const elapsed = +t.slice(8, 10);
  const history = covered >= 21 && prevTotal > 0;
  const daily = history ? prevTotal / covered : (elapsed ? variable(ym) / elapsed : 0);
  const daysLeft = +lastDay.slice(8, 10) - elapsed;
  const varLeft = Math.round(daily * daysLeft);
  const end = T.inc + pendInc - T.exp - pendExp - subsPend - loanPend - varLeft;
  return { end, lastDay, pendInc, fixedExp: pendExp + subsPend + loanPend, varLeft, daysLeft, basedOnHistory: history };
}

function barChart(ym) {
  const months = Array.from({length:6}, (_, i) => addMonths(ym, i - 5));
  const data = months.map(m => totals(m));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 340, H = 150, base = 120, top = 14, slot = W / 6, bw = 16;
  let bars = '';
  data.forEach((d, i) => {
    const x = i * slot + slot / 2;
    const hi = (d.inc / max) * (base - top), he = (d.exp / max) * (base - top);
    bars += `<rect x="${x - bw - 1}" y="${base - hi}" width="${bw}" height="${Math.max(hi, 0)}" rx="3" fill="var(--inc)"><title>Ingresos ${fmtCLP(d.inc)}</title></rect>`;
    bars += `<rect x="${x + 1}" y="${base - he}" width="${bw}" height="${Math.max(he, 0)}" rx="3" fill="var(--exp)"><title>Egresos ${fmtCLP(d.exp)}</title></rect>`;
    bars += `<text x="${x}" y="${base + 16}" text-anchor="middle" font-size="11" fill="${months[i] === ym ? 'var(--ink)' : 'var(--muted)'}" font-weight="${months[i] === ym ? 700 : 400}">${esc(monthShort(months[i]))}</text>`;
    bars += `<text x="${x}" y="${base + 30}" text-anchor="middle" font-size="10" fill="${d.net >= 0 ? 'var(--inc)' : 'var(--exp)'}">${d.inc || d.exp ? (d.net >= 0 ? '+' : '−') + short(Math.abs(d.net)) : ''}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H + 6}" role="img" aria-label="Ingresos y egresos de los últimos seis meses">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--inc)"></i>Ingresos</span><span><i style="background:var(--exp)"></i>Egresos</span><span>Bajo cada mes: flujo neto</span></div></div>`;
}

function catBars(ym) {
  const g = {};
  monthTx(ym).filter(t => counted(t) && dir(t) < 0).forEach(t => { const c = categoryOf(t); g[c] = (g[c] || 0) + clp(t); });
  const rows = Object.entries(g).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return `<p class="empty">Cuando registres gastos este mes, aquí verás en qué se van.</p>`;
  const total = rows.reduce((a, r) => a + r[1], 0);
  let top = rows.slice(0, 6);
  if (rows.length > 6) top.push(['Resto', rows.slice(6).reduce((a, r) => a + r[1], 0)]);
  const max = top[0][1];
  return `<ul class="cats">${top.map(([c, v]) => `<li><span>${esc(c)}<small>${Math.round(v / total * 100)}%</small></span><b class="money">${fmtCLP(v)}</b><span class="bar"><i style="width:${v / max * 100}%"></i></span></li>`).join('')}</ul>`;
}

function savingsList(sav) {
  if (!sav.length) return `<p class="empty">Registra tus cuentas de ahorro o metas (por ejemplo, fondo de emergencia) para verlas aquí.</p>`;

/* ---------- Suscripciones ---------- */
function subsData() {
  const groups = {};
  allTx().filter(t => !t.dupOf && bankOn(t) && dir(t) < 0 && isSub(t)).forEach(t => {
    const k = displayName(t);
    (groups[k] = groups[k] || []).push(t);
  });
  const out = [];
  Object.entries(groups).forEach(([name, g]) => {
    g.sort((a, b) => a.date.localeCompare(b.date));
    const last = g[g.length - 1];
    const gaps = g.slice(1).map((t, i) => daysBetween(t.date, g[i].date)).sort((a, b) => a - b);
    const med = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 30;
    const anual = med > 300;
    const since = daysBetween(today(), last.date);
    const active = since <= (anual ? 400 : 45);
    const clpLast = clpNow(last);
    out.push({ name, last, items:g, anual, active, monthly: anual ? clpLast / 12 : clpLast, day: +last.date.slice(8, 10),
               next: addToDate(last.date, anual ? 12 : 1) });
  });
  return out.sort((a, b) => a.day - b.day || a.name.localeCompare(b.name));
}

/* ---------- Análisis con IA ---------- */
function lastMonths(ym, n) { return Array.from({length:n}, (_, i) => addMonths(ym, i - n + 1)); }

function buildPrompt(n) {
  const months = lastMonths(S.ui.month, n);
  const L = [];
  L.push('Actúa como un asesor financiero personal riguroso. Analiza mis finanzas con los datos agregados de abajo (montos en pesos chilenos).');
  if (S.settings.context.trim()) L.push('\nContexto personal: ' + S.settings.context.trim());
  L.push('\n## Resumen mensual');
  L.push('| Mes | Ingresos | Egresos | Flujo | % ahorrado |'); L.push('|---|---|---|---|---|');
  months.forEach(m => { const T = totals(m); L.push(`| ${monthLong(m)} | ${fmtCLP(T.inc)} | ${fmtCLP(T.exp)} | ${signed(T.net)} | ${T.inc ? Math.round(T.net / T.inc * 100) + '%' : '—'} |`); });

  const cats = {};
  months.forEach((m, i) => monthTx(m).filter(t => counted(t) && dir(t) < 0).forEach(t => { const c = categoryOf(t); (cats[c] = cats[c] || months.map(() => 0))[i] += clp(t); }));
  L.push('\n## Egresos por categoría');
  L.push('| Categoría | ' + months.map(monthShort).join(' | ') + ' |'); L.push('|---|' + months.map(() => '---').join('|') + '|');
  Object.entries(cats).sort((a, b) => b[1].reduce((x, y) => x + y) - a[1].reduce((x, y) => x + y)).forEach(([c, v]) => L.push(`| ${c} | ${v.map(fmtCLP).join(' | ')} |`));

  const merch = {};
  months.forEach(m => monthTx(m).filter(t => counted(t) && dir(t) < 0 && effTipo(t) !== 'descuento').forEach(t => {
    const hasRule = ruleFor(t) && !ruleFor(t).builtin;
    let name = displayName(t);
    if ((effTipo(t) === 'transfer_out') && !t.name && !hasRule) name = 'Transferencias a personas';
    merch[name] = merch[name] || { v:0, n:0 }; merch[name].v += clp(t); merch[name].n++;
  }));
  L.push('\n## Comercios con más gasto en el período');
  Object.entries(merch).sort((a, b) => b[1].v - a[1].v).slice(0, 15).forEach(([k, o]) => L.push(`- ${k}: ${fmtCLP(o.v)} en ${o.n} cobro${o.n > 1 ? 's' : ''}`));

  const subs = subsData().filter(s => s.active);
  L.push('\n## Suscripciones activas');
  if (subs.length) subs.forEach(s => L.push(`- ${s.name}: ${fmtCLP(s.monthly)} al mes${s.anual ? ' (plan anual)' : ''}${s.last.currency === 'USD' ? ` (se cobra en dólares: ${fmtUSD(s.last.amount)})` : ''}`));
  else L.push('- Ninguna detectada');

  const sav = savingsRecs();
  L.push('\n## Ahorros');
  L.push(sav.length ? sav.map(s => `- ${s.name}: ${fmtCLP(s.balance)}${s.goal ? ` (meta ${fmtCLP(s.goal)})` : ''}`).join('\n') : '- Sin ahorros registrados');

  L.push(`\n## Lo que necesito
1. Gastos prescindibles o "hormiga": cuáles son, cuánto suman al mes y cuánto podría ahorrar de forma realista.
2. Suscripciones: detecta servicios que se superponen en función, planes anuales que convengan y cuáles cancelar o bajar de plan.
3. Un presupuesto mensual por categoría acorde a mis ingresos.
4. Cuánto destinar a ahorro y fondo de emergencia, y en qué orden.
5. Tres acciones concretas para el próximo mes, ordenadas por impacto.
Distingue lo que se desprende de los datos de lo que es supuesto. Si falta información para una conclusión, dilo.`);
  return L.join('\n');
}

function openSheet(title, html, onMount) {
  const host = $('#sheetHost');
  host.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close-btn aria-label="Cerrar sin guardar">×</button></div>${html}</div></div>`;
  const bg = host.firstElementChild;
  // Cancelar junto al botón principal: cierra sin guardar nada.
  bg.querySelectorAll('.actions').forEach(a => {
    const sub = a.querySelector('button[type=submit]');
    if (!sub || a.querySelector('[data-cancel]')) return;
    const wrap = document.createElement('span'); wrap.className = 'act-r';
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn ghost'; c.textContent = 'Cancelar'; c.dataset.cancel = '1';
    sub.replaceWith(wrap); wrap.append(c, sub);
  });
  bg.addEventListener('click', e => { if (e.target.dataset.close || e.target.closest('[data-close-btn],[data-cancel]')) closeSheet(); });
  document.addEventListener('keydown', escClose);
  onMount && onMount(bg.querySelector('.sheet'));
  if (matchMedia('(pointer:fine)').matches) {
    const first = bg.querySelector('input:not([type=radio]):not([type=hidden]),select,textarea');
    first && setTimeout(() => first.focus({preventScroll:true}), 50);
  }
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetHost').innerHTML = ''; document.removeEventListener('keydown', escClose); }

function catOptions(d, sel) {
  const list = d > 0 ? INC_CATS : EXP_CATS;
  return list.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function saveTx(t, f) {
  const k = f.elements.tipo.value;
  const monto = Number(f.elements.monto.value);
  if (!(monto > 0)) { toast('Ingresa un monto mayor que cero.'); return; }
  const isNew = !t;
  const prevEff = isNew ? null : effTipo(t);
  t = t || { id: uid('m'), kind:'tx', source:'manual' };
  const d = TIPOS[k].dir;
  const cat = d === 0 ? '' : f.elements.category.value;
  const typedName = f.elements.name.value.trim();
  const autoName = isNew ? '' : (() => { const saved = t.name; t.name = ''; const n = displayName(t); t.name = saved; return n; })();

  t.tipo = k;
  if (!isNew && k !== prevEff) t.tipoLocked = true;
  t.currency = f.elements.currency.value;
  t.date = f.elements.date.value;
  t.bank = f.elements.bank.value || (t.source === 'manual' ? '' : t.bank);
  t.note = f.elements.note.value.trim();
  t.reviewed = true;
  t.category = cat;
  if (d < 0) t.sub = f.elements.sub.value === 'si' ? true : f.elements.sub.value === 'no' ? false : undefined;
  if (t.currency === 'USD' && !t.fx) t.fx = rate() || undefined;
  if (typedName && typedName !== autoName) t.name = typedName;

  // Sueldo con bruto u honorarios: el ingreso es el bruto y se crea el descuento en egresos.
  const childId = t.id + '_desc';
  let child = null;
  t.mode = undefined; t.net = undefined; t.amount = monto;
  if (k === 'ingreso' && cat === 'Sueldo' && Number(f.elements.bruto.value) > monto) {
    t.mode = 'sueldo'; t.amount = Number(f.elements.bruto.value); t.net = monto;
    child = { name:'Descuentos legales del sueldo', amount: t.amount - monto };
  } else if (k === 'ingreso' && cat === 'Turnos / honorarios' && f.elements.boleta.checked) {
    const pct = retencionDe(+t.date.slice(0, 4));
    const ret = Math.round(monto * pct / 100);
    t.mode = 'honorarios'; t.net = monto - ret; t.payer = f.elements.payer.value.trim() || undefined;
    child = { name:`Retención SII de la boleta (${String(pct).replace('.', ',')}%)`, amount: ret };
  }
  if (child) put({ ...(S.recs[childId] || {}), id: childId, kind:'tx', source:'auto', parent: t.id, tipo:'descuento', tipoLocked:true,
                   category:'Descuentos y retenciones', name: child.name, amount: child.amount, currency:'CLP', date: t.date, reviewed:true, deleted:false });
  else if (S.recs[childId] && !S.recs[childId].deleted) removeRec(childId);

  put(t);
  if (f.elements.rule && f.elements.rule.checked && (t.rawName || t.counterparty)) {
    const match = matchKey(t.rawName || t.counterparty);
    const existing = userRules().find(r => r.match === match && r.amount == null);
    put({ ...(existing || { id: uid('ru'), kind:'rule', match }), name: displayName(t), category: cat || undefined, sub: t.sub });
  }
  dedupPass();
  closeSheet(); render();
  toast(isNew ? 'Movimiento agregado.' : 'Cambios guardados.');
  checkBudgetAlerts();
}

/* =====================================================================
   Cartola (Excel o CSV)
   ===================================================================== */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.onload = res;
    s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Conéctate a internet una vez para descargarlo, o usa un CSV.'));
    document.head.appendChild(s);
  });
}
function parseCSV(txt) {
  const first = txt.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  return txt.split(/\r?\n/).map(line => {
    const out = []; let cur = '', q = false;
    for (const ch of line) {
      if (ch === '"') q = !q;
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(c => c.trim());
  });
}
function cellNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/[$\sCLP]/gi, '');
  if (!s) return 0;
  const neg = /^-|^\(.*\)$/.test(s);
  s = s.replace(/[()-]/g, '').replace(/,\d{1,2}$/, '').replace(/[.,]/g, '');
  const n = Number(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function cellDate(v) {
  if (v instanceof Date && !isNaN(v)) return isoOf(v);
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v || '').trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function findHeader(rows) {
  let best = 0, bestScore = -1;
  rows.slice(0, 40).forEach((r, i) => {
    const txt = norm(r.join(' '));
    const sc = ['FECHA', 'DESCRIP', 'DETALLE', 'GLOSA', 'CARGO', 'ABONO', 'MONTO', 'MOVIMIENTO'].filter(k => txt.includes(k)).length;
    if (sc > bestScore) { bestScore = sc; best = i; }
  });
  return best;
}

async function importCartola(file, bank) {
  let rows;
  try {
    if (/\.csv$/i.test(file.name)) rows = parseCSV(await file.text());
    else {
      await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
    }
  } catch (e) { toast(e.message); return; }
  const hi = findHeader(rows);
  const header = (rows[hi] || []).map(c => String(c).trim());
  const saved = S.settings.cartolaMaps[bank] || {};
  const guess = re => { const i = header.findIndex(h => re.test(norm(h))); return i; };
  const map = {
    fecha: saved.fecha ?? guess(/FECHA/),
    desc: saved.desc ?? guess(/DESCRIP|DETALLE|GLOSA|MOVIMIENTO|CONCEPTO/),
    cargo: saved.cargo ?? guess(/CARGO|DEBE|EGRESO|GIRO/),
    abono: saved.abono ?? guess(/ABONO|HABER|INGRESO|DEPOSITO/),
    monto: saved.monto ?? guess(/^MONTO|IMPORTE/)
  };
  const opt = sel => `<option value="-1">No usar</option>` + header.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h || 'Columna ' + (i + 1))}</option>`).join('');
  const preview = rows.slice(hi, hi + 5).map(r => `<tr>${r.slice(0, 8).map(c => `<td>${esc(c instanceof Date ? isoOf(c) : c)}</td>`).join('')}</tr>`).join('');
  openSheet('Columnas de la cartola', `
    <p class="calc">Revisa qué columna corresponde a cada dato. Se recuerda para la próxima cartola de ${esc(BANKS[bank])}.</p>
    <div class="map-table"><table>${preview}</table></div>
    <form class="form" id="mapForm" style="margin-top:14px">
      <label class="f">Fecha<select class="in" name="fecha">${opt(map.fecha)}</select></label>
      <label class="f">Descripción<select class="in" name="desc">${opt(map.desc)}</select></label>
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="f">Cargos (salidas)<select class="in" name="cargo">${opt(map.cargo)}</select></label>
        <label class="f">Abonos (entradas)<select class="in" name="abono">${opt(map.abono)}</select></label>
      </div>
      <label class="f">O un solo monto con signo<small>Úsalo solo si la cartola no separa cargos y abonos</small><select class="in" name="monto">${opt(map.cargo > -1 || map.abono > -1 ? -1 : map.monto)}</select></label>
      <div class="actions"><span></span><button class="btn" type="submit">Importar</button></div>
    </form>`, sh => {
    $('#mapForm', sh).addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target;
      const m = { fecha:+f.elements.fecha.value, desc:+f.elements.desc.value, cargo:+f.elements.cargo.value, abono:+f.elements.abono.value, monto:+f.elements.monto.value };
      if (m.fecha < 0 || (m.cargo < 0 && m.abono < 0 && m.monto < 0)) { toast('Elige al menos la fecha y una columna de montos.'); return; }
      S.settings.cartolaMaps[bank] = m; save(); shareSettings();
      const res = ingestCartola(rows.slice(hi + 1), m, bank);
      closeSheet(); render();
      toast(`Cartola: ${res.added} nuevos, ${res.dups} ya estaban por correo, ${res.skipped} repetidos.`);
    });
  });
}

function ingestCartola(rows, m, bank) {
  const seen = {};
  let added = 0, skipped = 0;
  const before = new Set(allTx().filter(t => t.dupOf).map(t => t.id));
  rows.forEach(r => {
    const date = cellDate(r[m.fecha]);
    if (!date) return;
    const desc = m.desc > -1 ? String(r[m.desc] || '').trim() : '';
    let inAmt = 0, outAmt = 0;
    if (m.cargo > -1 || m.abono > -1) {
      outAmt = m.cargo > -1 ? Math.abs(cellNum(r[m.cargo])) : 0;
      inAmt = m.abono > -1 ? Math.abs(cellNum(r[m.abono])) : 0;
    } else {
      const v = cellNum(r[m.monto]);
      if (v < 0) outAmt = -v; else inAmt = v;
    }
    const amount = inAmt || outAmt;
    if (!amount) return;
    const nd = norm(desc);
    let tipo;
    if (inAmt) tipo = /TRANSF|TRASPASO|TEF/.test(nd) ? 'transfer_in' : 'ingreso';
    else if (/PAGO\s*(DE\s*)?(TARJ|TC|T\.C|TARJETA)|PAGO TAR/.test(nd)) tipo = 'pago_tarjeta';
    else if (/TRANSF|TRASPASO|TEF/.test(nd)) tipo = 'transfer_out';
    else tipo = 'gasto';
    const base = `ct_${bank}_${date}_${amount}_${matchKey(desc).slice(0, 24).replace(/\s/g, '')}`;
    seen[base] = (seen[base] || 0) + 1;
    const id = base + '_' + seen[base];
    if (S.recs[id]) { skipped++; return; }
    const isTransfer = tipo === 'transfer_in' || tipo === 'transfer_out';
    const rec = { id, kind:'tx', source:'cartola', bank, tipo, amount, currency:'CLP', date,
                  rawName: isTransfer ? '' : desc.slice(0, 60), counterparty: isTransfer ? desc.replace(/^(TRANSF(ERENCIA)?|TRASPASO|TEF)\s*(DE|A|DESDE|PARA)?\s*/i, '').slice(0, 60) : '', reviewed:false };
    if (tipo === 'ingreso' && /REMUNERACION|SUELDO|NOMINA/.test(nd)) rec.category = 'Sueldo';
    put(rec); added++;
  });
  dedupPass();
  const dups = allTx().filter(t => t.dupOf && !before.has(t.id) && t.source === 'cartola').length;
  return { added: added - dups, dups, skipped };
}

/* =====================================================================
   Deudas: compras en cuotas (estados de cuenta) y créditos
   ===================================================================== */
const statements = () => Object.values(S.recs).filter(r => r.kind === 'card_statement' && alive(r));
const loans = () => Object.values(S.recs).filter(r => r.kind === 'debt' && alive(r)).sort((a, b) => a.name.localeCompare(b.name));
function latestStatements() {
  const m = {};
  statements().forEach(st => { if (!m[st.card] || st.date > m[st.card].date) m[st.card] = st; });
  return Object.values(m).sort((a, b) => cardLabel(a.card).localeCompare(cardLabel(b.card)));
}
const activeItems = st => (st.items || []).filter(i => i.on && !i.sub);
/* Movimientos no facturados: valen mientras no llegue un estado de cuenta más nuevo de esa tarjeta */
function activeUnbilled() {
  const billed = {};
  latestStatements().forEach(st => billed[st.card] = st.date);
  return Object.values(S.recs).filter(r => r.kind === 'card_unbilled' && alive(r) && !(billed[r.card] && billed[r.card] >= r.date));
}
const stDue = st => st.due || st.date;
const itemCLP = i => i.cur === 'USD' ? Math.round(i.vc * (rate() || 0)) : i.vc;

/* Fechas de pago de cada cuota. La cuota k vence en la fecha de pago del estado de cuenta;
   las siguientes, un mes después cada una. Una cuota 00/03 parte el mes siguiente. */
function itemEntries(i, st) {
  const D = stDue(st), amt = itemCLP(i);
  if (i.n <= 1) return [{ date: D, amt }];
  const out = [];
  for (let j = Math.max(i.k, 1); j <= i.n; j++) out.push({ date: addToDate(D, j - i.k), amt });
  return out;
}
/* Fecha con el día de pago elegido, ajustada al último día si el mes es más corto */
function dueOn(y, m, d) {
  const dt = new Date(y, m - 1, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(Math.min(d, last))}`;
}
function loanEntries(l) {
  const amt = l.currency === 'UF' ? Math.round(l.vc * ((S.settings.rates && S.settings.rates.uf) || 0)) : l.vc;
  const y0 = +l.firstDue.slice(0, 4), m0 = +l.firstDue.slice(5, 7), d = l.day || +l.firstDue.slice(8, 10);
  return Array.from({length: l.n}, (_, j) => ({ date: dueOn(y0, m0 + j, d), amt }));
}
const sumAmt = a => a.reduce((s, e) => s + e.amt, 0);
const stThisPayment = st => sumAmt(activeItems(st).flatMap(i => itemEntries(i, st)).filter(e => e.date === stDue(st)));
const stDebt = st => sumAmt(activeItems(st).flatMap(i => itemEntries(i, st)));

/* Estado de cada deuda a la fecha de hoy: cuotas pagadas se estiman por las fechas de pago ya pasadas */
function debtItems() {
  const t = today(), out = [];
  [...latestStatements(), ...activeUnbilled()].forEach(st => (st.items || []).forEach((i, idx) => {
    if (!i.on || i.sub) return;
    const e = itemEntries(i, st);
    out.push({ type:'cuota', sid: st.id, idx, name: itemName(i), where: cardLabel(st.card) + (st.kind === 'card_unbilled' ? ', sin facturar' : ''), card: st.card, n: Math.max(i.n, 1), vc: itemCLP(i), usd: i.cur === 'USD' ? i.vc : null,
               paid: Math.max(i.k - 1, 0) + e.filter(x => x.date <= t).length, entries: e, end: e[e.length - 1].date,
               left: sumAmt(e.filter(x => x.date > t)), single: i.n <= 1 });
  }));
  // Movimientos fijos marcados como pago de deuda
  fixedRecs().filter(f => f.debt && TIPOS[f.tipo].dir < 0).forEach(f => {
    const e = fixedDates(f, f.end || addToDate(t, 12)).map(date => ({ date, amt: fixedCLP(f) }));
    if (!e.length) return;
    out.push({ type:'fixed', id: f.id, name: f.name, where: 'Pago mensual', n: f.end ? e.length : 0, vc: fixedCLP(f), uf: f.currency === 'UF' ? f.amount : null,
               paid: e.filter(x => x.date <= t).length, entries: e, end: f.end || '', open: !f.end,
               left: f.end ? sumAmt(e.filter(x => x.date > t)) : 0, single: false });
  });
  loans().forEach(l => {
    const e = loanEntries(l);
    out.push({ type:'loan', id: l.id, name: l.name, where: l.lender || '', n: l.n, vc: e[0] ? e[0].amt : 0, uf: l.currency === 'UF' ? l.vc : null,
               paid: e.filter(x => x.date <= t).length, entries: e, end: e.length ? e[e.length - 1].date : t,
               left: sumAmt(e.filter(x => x.date > t)), single: false });
  });
  return out;
}
function debtSummary() {
  const items = debtItems();
  if (!items.length) return null;
  const t = today();
  const future = items.flatMap(d => d.entries).filter(e => e.date > t).sort((a, b) => a.date.localeCompare(b.date));
  const nextYm = future.length ? future[0].date.slice(0, 7) : '';
  return { debt: items.reduce((a, d) => a + d.left, 0), next: sumAmt(future.filter(e => e.date.startsWith(nextYm))), nextYm };
}
function monthlyPayments(n) {
  const months = Array.from({length:n}, (_, i) => addMonths(ymNow(), i));
  const all = debtItems().flatMap(d => d.entries);
  return { months, vals: months.map(m => sumAmt(all.filter(e => e.date.startsWith(m)))) };
}

const isFee = i => /\b(COMISION|IMPUESTO DECRETO|SEGURO|INTERESES?|MANTENCION|CARGO POR|ADMINISTRACION)/.test(norm(i.desc));
function cardCosts() {
  const out = { has:false, interestMonth:0, interestLeft:0, feesMonth:0, fees:[], prepay:[] };
  const feeMap = {};
  latestStatements().forEach(st => (st.items || []).forEach((i, idx) => {
    if (!i.on) return;
    if (isFee(i) && i.n <= 1) {
      const name = itemName(i);
      feeMap[name] = feeMap[name] || { name, amt:0, n:0 };
      feeMap[name].amt += itemCLP(i); feeMap[name].n++; out.feesMonth += itemCLP(i); out.has = true;
      return;
    }
    if (i.n > 1 && i.tp > i.mo) {
      const interest = i.tp - i.mo, leftN = Math.max(i.n - paidOf(i, st), 0);
      out.interestMonth += Math.round(interest / i.n);
      const il = Math.round(interest * leftN / i.n);
      out.interestLeft += il; out.has = true;
      if (leftN > 0) out.prepay.push({ name: itemName(i), rate: i.rate || 0, left: itemCLP(i) * leftN, interestLeft: il, sid: st.id, idx });
    }
  }));
  out.fees = Object.values(feeMap).sort((a, b) => b.amt - a.amt);
  out.prepay.sort((a, b) => b.rate - a.rate || b.interestLeft - a.interestLeft);
  return out;
}

function itemName(i) {
  if (i.name) return i.name;
  const r = ruleFor({ rawName: i.desc, tipo:'gasto', amount: i.vc, currency: i.cur || 'CLP' });
  return (r && r.name) || cleanName(i.desc) || i.desc;
}
/* ¿Es una suscripción? Se excluye porque ya se cuenta en Suscripciones. */
function itemIsSub(desc, vc, n) {
  if (n > 1) return false;
  const r = ruleFor({ rawName: desc, tipo:'gasto', amount: vc, currency:'CLP', date: today() });
  if (r && r.sub === true) return true;
  const key = matchKey(desc);
  if (recurringKeys().has(key)) return true;
  return subsData().some(sd => sd.active && matchKey(sd.name).length >= 4 && key.includes(matchKey(sd.name)));
}

const monthYear = s => { const t = dateOfYm(s.slice(0, 7)).toLocaleDateString('es-CL', {month:'short', year:'numeric'}).replace('.', ''); return t; };

  const row = d => {
    if (d.open) return `<li tabindex="0" class="click" data-fixed-debt="${esc(d.id)}"><div class="dl-top"><span class="dl-name">${esc(d.name)}</span><b class="money">${fmtCLP(d.vc)} al mes</b></div>

      <div class="dl-top"><span class="dl-name">${esc(d.name)}</span><b class="money">${fmtCLP(d.left)}</b></div>
      <div class="dl-bar" role="img" aria-label="${d.paid} de ${d.n} cuotas pagadas"><i style="width:${pct}%"></i></div>
      <div class="dl-meta"><span>Pagadas ${d.paid} de ${d.n}${d.where && manyPlaces ? ` (${esc(d.where)})` : ''}</span><span>${vcTxt} al mes, termina en ${esc(monthYear(d.end))}</span></div></li>`;
  };
  $('#tab-deudas').innerHTML = `
    <table class="subs"><thead><tr>
      <th colspan="2" scope="col"><span class="total money">${fmtCLP(sum ? sum.debt : 0)}</span><span class="total-l">deuda total por pagar</span></th>
      <th scope="col"><span class="fx money">${fmtCLP(sum ? sum.next : 0)}</span><span class="fx-l">${sum && sum.nextYm ? 'próximo pago (' + esc(monthOnly(sum.nextYm)) + ')' : 'próximo pago'}</span></th>
    </tr></thead></table>

    <section class="block"><h2>Pagos por mes</h2>
      <div class="proj" role="img" aria-label="Pagos de deudas en los próximos seis meses">${months.map((m, i) => `<div><i style="height:${vals[i] / max * 100}%"></i><b>${vals[i] ? short(vals[i]) : '—'}</b><span>${esc(monthShort(m))}</span></div>`).join('')}</div>
      <p class="note-small" style="margin:6px 0 0">Según la fecha de pago de cada cuota. No suma al flujo: las compras ya se registraron al hacerlas.</p>
    </section>

    <section class="block">
      <div class="h2row"><h2>Compras en cuotas y créditos</h2><span class="muted" style="font-size:14px">${inst.length} activas, ${pending} cuotas por pagar</span></div>
      ${inst.length ? `<ul class="debts">${inst.slice(0, 8).map(row).join('')}</ul>${inst.length > 8 ? `<details class="more"><summary>Ver ${inst.length - 8} más</summary><ul class="debts">${inst.slice(8).map(row).join('')}</ul></details>` : ''}` : '<p class="empty">No tienes compras en cuotas pendientes.</p>'}
      ${singles.length ? `<details class="more"><summary>Compras sin cuotas por pagar (${singles.length})</summary><ul class="debts">${singles.map(d => `<li tabindex="0" class="click" data-debt="${esc(d.sid)}:${d.idx}"><div class="dl-top"><span class="dl-name">${esc(d.name)}</span><b class="money">${d.usd != null ? fmtUSD(d.usd) : fmtCLP(d.vc)}</b></div><div class="dl-meta"><span>Sin cuotas${manyPlaces ? ` (${esc(d.where)})` : ''}</span><span>Toca para pasarla a cuotas</span></div></li>`).join('')}</ul></details>` : ''}
      <p class="note-small" style="margin:8px 0 0">Toca una deuda para corregirla: nombre, si tiene cuotas, cuántas y su valor. Cada vez que pasa la fecha límite de pago se cuenta una cuota más como pagada. Sube el estado de cuenta de cada mes para corregir la estimación.${done ? ` ${done} compra${done > 1 ? 's' : ''} ya terminada${done > 1 ? 's' : ''} no se muestra${done > 1 ? 'n' : ''}.` : ''}</p>
      <div class="btns">${addLoan}</div>

        <p class="note-small" style="margin:6px 0 0">Ordenadas por tasa de interés. Las compras en cuotas sin interés no tienen costo extra, así que no conviene prepagarlas antes.</p>` : ''}
    </div></section>` : ''}

    <section class="block"><h2>Estados de cuenta y movimientos</h2>
    ${sts.map(st => {
      const subs = (st.items || []).filter(i => i.on && i.sub);
      if (st.kind === 'card_unbilled') return `<div class="panel">
        <div class="card-h" style="margin:0 0 6px"><h2>${esc(cardLabel(st.card))}</h2><small>No facturados ${st.cur === 'USD' ? 'internacionales' : 'nacionales'} al ${dmy(st.date)}, pago estimado ${dmy(st.due)}</small></div>
        <div class="sumline"><span>Se sumará al próximo pago</span><b class="money">${fmtCLP(stThisPayment(st))}</b></div>
        ${subs.length ? `<p class="note-small" style="margin:0">Suscripciones excluidas: ${subs.map(i => esc(itemName(i))).join(', ')}.</p>` : ''}
        <div class="btns"><button class="btn danger" data-st-del="${esc(st.id)}">Eliminar</button></div></div>`;
      return `<div class="panel">
        <div class="card-h" style="margin:0 0 6px"><h2><button class="nm link" style="color:var(--ink);font-size:17px;padding:0" data-card-rename="${esc(st.card)}">${esc(cardLabel(st.card))}</button></h2><small>Facturado el ${dmy(st.date)}${st.due ? `, pago hasta ${dmy(st.due)}` : ''}</small></div>
        <div class="sumline"><span>Total de ese pago</span><b class="money">${fmtCLP(stThisPayment(st))}</b></div>
        ${subs.length ? `<p class="note-small" style="margin:0">Suscripciones excluidas: ${subs.map(i => esc(itemName(i))).join(', ')}.</p>` : ''}
        <div class="btns"><button class="btn ghost" data-st-edit="${esc(st.id)}">Revisar cargos</button><button class="btn danger" data-st-del="${esc(st.id)}">Eliminar</button></div></div>`;
    }).join('') || '<p class="empty">Aún no subes estados de cuenta.</p>'}
    <div class="btns">${upload}</div>
    </section>`;
}

  while (m < 600 && addToDate(D, m) <= t) m++;
  return m;
}
